# Atualiza duas vezes por semana, sozinho: Premier League desta época (dados.json), Liga Portuguesa (liga_pt.json) e seleções (selecoes.json).
name: Atualizar perguntas

on:
  schedule:
    - cron: '17 3 * * 2'   # terça 03:17 UTC (de madrugada: os jogos da liga de cada dia ficam iguais para todos)
    - cron: '17 3 * * 5'   # sexta 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Premier League desta época
        run: python scripts/quiz_dados.py
      - name: Liga Portuguesa (a época atual muda todas as semanas)
        continue-on-error: true
        run: python scripts/liga_pt.py
      - name: Seleções
        continue-on-error: true
        run: python scripts/selecoes.py
      - name: Guardar os dados
        run: |
          git config user.name "fora-da-caixa-bot"
          git config user.email "fora-da-caixa-bot@users.noreply.github.com"
          git add dados.json liga_pt.json selecoes.json
          if git diff --staged --quiet; then echo "Sem alterações."; else git commit -m "Perguntas atualizadas $(date -u +'%Y-%m-%d')" && git pull --rebase && git push; fi
